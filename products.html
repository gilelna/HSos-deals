<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSos — Products</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="app">

  <div id="layout-topbar"></div>

  <div class="app-body" id="app-body">
    <div id="layout-sidebar"></div>

    <div class="app-content">

      <!-- Page body -->
      <div class="products-scroll main scroll" id="products-scroll">

        <!-- Page header -->
        <div class="products-page-head">
          <div class="products-page-title">Products</div>
          <button class="btn btn-primary" onclick="PRODUCTS.openNewProduct()">+ New product</button>
        </div>

        <!-- Products list -->
        <div class="products-list" id="products-list">
          <div style="padding:32px;text-align:center;color:var(--mu2);font-size:13px">Loading…</div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Right panel -->
<div class="products-panel-overlay" id="products-panel-overlay" onclick="PRODUCTS.closePanel()"></div>
<aside class="products-panel" id="products-panel" aria-hidden="true">
  <div class="products-panel-head">
    <div>
      <div class="products-panel-title" id="pp-title">—</div>
      <div class="products-panel-sub" id="pp-sub"></div>
    </div>
    <button class="products-panel-close" onclick="PRODUCTS.closePanel()" aria-label="Close">✕</button>
  </div>
  <div class="products-panel-tabs" id="pp-tabs">
    <button class="products-panel-tab is-active" data-tab="details" onclick="PRODUCTS.switchTab('details')">Details</button>
    <button class="products-panel-tab" data-tab="deals" onclick="PRODUCTS.switchTab('deals')">Deals</button>
  </div>
  <div class="products-panel-body" id="pp-body">
    <!-- Details / Deals tab content rendered by products.js -->
  </div>
  <div class="products-panel-actions">
    <button class="btn btn-danger btn-sm" id="pp-delete" onclick="PRODUCTS.delete()">Delete</button>
    <div class="spacer"></div>
    <button class="btn" onclick="PRODUCTS.closePanel()">Cancel</button>
    <button class="btn btn-primary" onclick="PRODUCTS.save()">Save</button>
  </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="env-keys.js"></script>
<script src="env-config.js"></script>
<script src="db.js"></script>
<script src="cache.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
<script src="router.js"></script>
<script src="components/user-menu.js"></script>
<script src="components/layout.js"></script>
<script src="products.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (!guardSpace('operations', 'workload.html')) return
    await LAYOUT.init('Products', 'operations')
    await PRODUCTS.init()
  })
</script>
</body>
</html>

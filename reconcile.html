<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSos — Reconcile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:wght@400;600;700&family=DM+Sans:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    /* Layout: tab strip + two-column body + sticky action bar.
       Uses only shared.css variables — no hardcoded hex. */
    .rc-tabbar {
      display: flex; gap: 4px; padding: 12px 24px 0; border-bottom: 1px solid var(--border);
    }
    .rc-tab {
      padding: 8px 14px; font-size: 13px; font-weight: 600; color: var(--mu);
      background: transparent; border: 0; border-bottom: 2px solid transparent;
      cursor: pointer; font-family: var(--font-sans);
    }
    .rc-tab.cur { color: var(--ink); border-bottom-color: var(--ink); }
    .rc-tab:hover:not(.cur) { color: var(--ink); }

    .rc-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px 8px; gap: 12px; flex-wrap: wrap;
    }
    .rc-toolbar .rc-search {
      width: 240px; height: 30px; border: 1px solid var(--border); border-radius: 6px;
      padding: 0 10px; font-family: var(--font-sans); font-size: 12px;
      background: var(--surface); color: var(--ink); outline: none;
    }
    .rc-toolbar .rc-search:focus { border-color: var(--ink); }
    .rc-meta { font-size: 12px; color: var(--mu2); font-family: var(--font-mono); }

    .rc-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      padding: 0 24px 120px;
    }
    .rc-col { min-width: 0; }
    .rc-col-head {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 6px 4px 10px; border-bottom: 1px solid var(--border); margin-bottom: 10px;
    }
    .rc-col-head h3 { margin: 0; font-size: 13px; font-weight: 700; color: var(--ink); }
    .rc-col-head .rc-count { font-size: 11px; color: var(--mu); font-family: var(--font-mono); }

    .rc-list { display: flex; flex-direction: column; gap: 8px; }
    .rc-card {
      border: 1px solid var(--border); border-radius: 8px; padding: 12px;
      background: var(--surface); cursor: pointer; transition: border-color .12s, background .12s;
    }
    .rc-card:hover { border-color: var(--ink); }
    .rc-card.sel { border-color: var(--ink); background: var(--bg); box-shadow: 0 0 0 1px var(--ink) inset; }
    .rc-card.suggested { border-color: var(--green); background: var(--green-bg); }
    .rc-card.suggested.sel { box-shadow: 0 0 0 1px var(--ink) inset; }
    .rc-card.highlight { border-color: var(--amber); background: var(--amber-bg); }

    .rc-card-row {
      display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    }
    .rc-card-title { font-size: 13px; font-weight: 600; color: var(--ink); }
    .rc-card-amount { font-family: var(--font-mono); font-size: 13px; color: var(--ink); }
    .rc-card-meta { font-size: 11px; color: var(--mu); margin-top: 4px; }
    .rc-badge {
      display: inline-block; font-size: 10px; font-family: var(--font-mono);
      padding: 2px 6px; border-radius: 10px; margin-right: 4px;
    }
    .rc-badge.pending  { background: var(--amber-bg); color: var(--amber-text); }
    .rc-badge.overdue  { background: var(--red-bg);   color: var(--red-text); }
    .rc-badge.invoiced { background: var(--purple-bg); color: var(--purple-text); }
    .rc-badge.partial  { background: var(--gold-bg);   color: var(--amber-text); }
    .rc-badge.suggest  { background: var(--green-bg);  color: var(--green-text); }
    .rc-badge.gi       { background: var(--blue-bg);   color: var(--blue-text); }
    .rc-badge.draft    { background: var(--bg);        color: var(--mu); border: 1px solid var(--border); }
    .rc-badge.submitted{ background: var(--blue-bg);   color: var(--blue-text); }
    .rc-badge.approved { background: var(--green-bg);  color: var(--green-text); }

    .rc-empty { padding: 30px; text-align: center; color: var(--mu2); font-size: 12px; }

    /* Action bar — sticky at bottom of content (NOT position:fixed). */
    .rc-actionbar {
      position: sticky; bottom: 0; left: 0; right: 0; margin-top: 16px;
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
      gap: 16px; z-index: 5;
    }
    .rc-actionbar.hidden { display: none; }
    .rc-actionbar-summary { font-size: 13px; color: var(--ink); }
    .rc-actionbar-summary .rc-arrow { color: var(--mu); margin: 0 6px; }
    .rc-actionbar-summary .rc-diff { color: var(--mu); font-family: var(--font-mono); margin-left: 10px; }
    .rc-actionbar-buttons { display: flex; gap: 8px; }
    .rc-actionbar-buttons button {
      height: 32px; padding: 0 14px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
      background: var(--surface); color: var(--ink); font-family: var(--font-sans);
    }
    .rc-actionbar-buttons button.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
    .rc-actionbar-buttons button:hover { border-color: var(--ink); }
    .rc-actionbar-buttons button.primary:hover { opacity: 0.85; }

    @media (max-width: 900px) {
      .rc-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="app">
  <div id="layout-topbar"></div>
  <div class="app-body" id="app-body">
    <div id="layout-sidebar"></div>
    <div class="app-content" style="position:relative">

      <div class="space-cover payments">
        <div class="space-cover__bg" style="background-image:url('files/payments.png')"></div>
        <div class="space-cover__overlay"></div>
        <div class="space-cover-eyebrow">Payments · Finance</div>
        <div class="space-cover-title">Reconcile</div>
        <div class="cover-widgets">
          <a class="alert-card" href="#" onclick="return false">
            <div class="alert-card-val" id="rc-metric-suggested">—</div>
            <div class="alert-card-label">Suggested matches</div>
          </a>
          <a class="alert-card" href="#" onclick="return false">
            <div class="alert-card-val" id="rc-metric-open">—</div>
            <div class="alert-card-label">Open items</div>
          </a>
          <a class="alert-card" href="#" onclick="return false">
            <div class="alert-card-val" id="rc-metric-unmatched">—</div>
            <div class="alert-card-label">Unmatched tx</div>
          </a>
        </div>
      </div>

      <div class="alert-bar"></div>

      <div class="rc-tabbar">
        <button class="rc-tab cur" id="rc-tab-deals" onclick="rcSwitchTab('deals')">Deals</button>
        <button class="rc-tab"     id="rc-tab-bills" onclick="rcSwitchTab('bills')">Bills</button>
      </div>

      <div class="rc-toolbar">
        <input type="search" id="rc-search" class="rc-search" placeholder="Filter by name…" oninput="rcRender()">
        <div class="rc-meta" id="rc-meta">—</div>
      </div>

      <div class="rc-grid">
        <div class="rc-col">
          <div class="rc-col-head">
            <h3 id="rc-left-title">Open deals</h3>
            <span class="rc-count" id="rc-left-count">—</span>
          </div>
          <div class="rc-list" id="rc-left-list">
            <div class="rc-empty">Loading…</div>
          </div>
        </div>
        <div class="rc-col">
          <div class="rc-col-head">
            <h3>Unmatched transactions</h3>
            <span class="rc-count" id="rc-right-count">—</span>
          </div>
          <div class="rc-list" id="rc-right-list">
            <div class="rc-empty">Loading…</div>
          </div>
        </div>
      </div>

      <div class="rc-actionbar hidden" id="rc-actionbar">
        <div class="rc-actionbar-summary" id="rc-actionbar-summary"></div>
        <div class="rc-actionbar-buttons" id="rc-actionbar-buttons"></div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="env-keys.js"></script>
<script src="env-config.js"></script>
<script src="db.js"></script>
<script src="cache.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
<script src="router.js"></script>
<script src="components/user-menu.js"></script>
<script src="components/layout.js"></script>
<script src="reconcile.js"></script>
</body>
</html>

<!-- components/topbar.html — Shared topbar component -->
<div class="topbar">
  <a class="tb-logo" href="index.html">HSos</a>
  <span id="topbar-page-title" style="font-size:13px;color:var(--mu);font-family:var(--font-sans);margin-left:4px"></span>
  <div id="env-toggle-container" style="display:flex;align-items:center"></div>
  <div class="role-selector" id="role-selector"></div>
  <div style="display:flex;align-items:center;gap:12px;position:relative">
    <div id="bell-container" style="position:relative;cursor:pointer" onclick="BELL.toggle()">
      <svg id="bell-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
           style="color:var(--mu);display:block">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span id="bell-badge" style="
        display:none; position:absolute; top:-4px; right:-4px;
        background:var(--red); color:#fff; border-radius:10px;
        font-size:9px; font-family:var(--font-mono); font-weight:700;
        min-width:16px; height:16px; padding:0 3px;
        align-items:center; justify-content:center; line-height:1;
      "></span>
    </div>
    <div id="bell-dropdown" style="
      display:none; position:absolute; top:calc(100% + 8px); right:0; z-index:500;
      background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
      box-shadow:0 8px 24px rgba(0,0,0,0.12); width:360px; max-height:480px;
      flex-direction:column; overflow:hidden;
    ">
      <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:13px;font-weight:600">Notifications</span>
        <span id="bell-mark-all" style="font-size:11px;color:var(--blue-text);cursor:pointer"
              onclick="BELL.markAllDone()">Mark all done</span>
      </div>
      <div id="bell-list" style="overflow-y:auto;flex:1;padding:8px 0">
        <div style="padding:20px;text-align:center;color:var(--mu2);font-size:12px">Loading…</div>
      </div>
    </div>
    <span class="tb-user-name" id="topbar-name"></span>
    <div class="tb-av" style="background:var(--ink);cursor:default">HS</div>
  </div>
</div>
